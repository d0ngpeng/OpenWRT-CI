#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: false
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  TZ: Asia/Shanghai

jobs:
  core:
    name: ${{inputs.WRT_SOURCE || inputs.WRT_REPO}}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      #WiFi 密码只从仓库 Secret 读：仓库是公开的，密码写进代码等于公开
      #没配 Secret 时用兜底密码，固件不会变成开放网络
      WRT_WORD: ${{secrets.WRT_WORD || '12345678'}}
      #Go 模块下载源：GitHub runner 直连官方源最快，官方源不可用时才退到镜像。
      #不要用 goproxy.cn / aliyun：它们缓存的 moby/buildkit v0.29.0 与官方 sumdb 不一致，
      #会导致 "checksum mismatch ... SECURITY ERROR"，docker-compose 必然编不过。
      GOPROXY: https://proxy.golang.org,https://goproxy.io,https://mirrors.cloud.tencent.com/go,direct
      GOSUMDB: sum.golang.org
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -yq update
          sudo -E apt-get -yq install --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint bc binutils bison build-essential \
            bzip2 ca-certificates ccache clang cmake cpio curl device-tree-compiler dos2unix ecj fastjar file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git gperf haveged help2man intltool jq \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libgnutls28-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm lrzsz msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-cryptography python3-dev python3-docutils python3-packaging python3-ply \
            python3-pyelftools python3-pip python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip upx-ucl vim wget xmlto xz-utils xxd zlib1g-dev zstd

          sudo timedatectl set-timezone "$TZ"

          #runner 预装了 .NET/Android/GHC/Boost 等一大堆用不到的东西，先删掉给编译腾空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/share/miniconda /opt/az /usr/local/.ghcup 2>/dev/null || true
          df -h /

          #编译目录放到 /mnt，避免 / 分区空间不足
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER":"$USER" /mnt/build_wrt
          sudo rm -rf "$GITHUB_WORKSPACE/wrt"
          sudo ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(date +'%y.%m.%d_%H.%M.%S')" >> "$GITHUB_ENV"
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "WRT_VER=$(basename "$WRT_REPO" .git)-$WRT_BRANCH" >> "$GITHUB_ENV"
          echo "WRT_TARGET=$(grep -m1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_ENV"

          #配置/脚本一改，缓存就换 key，避免拿到不匹配的 toolchain
          echo "WRT_CFG_HASH=$(sha256sum Config/"$WRT_CONFIG".txt Config/GENERAL.txt Scripts/*.sh | sha256sum | cut -c1-8)" >> "$GITHUB_ENV"

      - name: Clone Code
        run: |
          cd "$GITHUB_WORKSPACE"
          for i in 1 2 3; do
            if git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "源码克隆失败：$WRT_REPO ($WRT_BRANCH)"
              exit 1
            fi
            sudo find /mnt/build_wrt -mindepth 1 -delete 2>/dev/null || true
            sleep $((i * 5))
          done

          cd ./wrt/
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> "$GITHUB_ENV"

          #GitHub 的机器在国外，去掉国内镜像源，避免拉取超时
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            jq '
              with_entries(
                .value |= map(select(
                  test("^https?://(mirrors\\.tencent\\.com|mirrors\\.aliyun\\.com|mirrors\\.tuna\\.tsinghua\\.edu\\.cn|mirrors\\.ustc\\.edu\\.cn|mirror\\.iscas\\.ac\\.cn|mirror\\.nju\\.edu\\.cn)(/|$)")
                  | not
                ))
              )
            ' "$PROJECT_MIRRORS_FILE" > "$PROJECT_MIRRORS_FILE.tmp" \
              && mv "$PROJECT_MIRRORS_FILE.tmp" "$PROJECT_MIRRORS_FILE" \
              || echo "mirrors json 处理失败，保持原样"
          fi
          sed -i '/raw\.gitmirror\.com/d' ./scripts/download.pl 2>/dev/null || true

      - name: Check Scripts
        run: |
          find ./Config ./Scripts -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          key: ${{runner.os}}-24-${{env.WRT_CONFIG}}-${{env.WRT_VER}}-${{env.WRT_HASH}}-${{env.WRT_CFG_HASH}}
          restore-keys: |
            ${{runner.os}}-24-${{env.WRT_CONFIG}}-${{env.WRT_VER}}-${{env.WRT_HASH}}-
            ${{runner.os}}-24-${{env.WRT_CONFIG}}-${{env.WRT_VER}}-
            ${{runner.os}}-24-${{env.WRT_CONFIG}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ -d "./wrt/staging_dir" ]; then
            #缓存恢复出来的 host 工具与工具链，时间戳要比 stamp 新，否则会被重新编译
            for DIR in ./wrt/staging_dir/host ./wrt/staging_dir/toolchain-*; do
              [ -d "$DIR" ] || continue
              [ -d "$DIR/stamp" ] && find "$DIR/stamp" -maxdepth 1 -type f -exec touch {} + 2>/dev/null
              find "$DIR" -maxdepth 2 -type f -name ".*_compile*" -exec touch {} + 2>/dev/null
            done
            echo "toolchain cache restored"
          else
            echo "caches missed"
          fi

          if [ "${{steps.cache.outputs.cache-hit}}" != "true" ]; then
            CACHE_PREFIX="${{runner.os}}-24-$WRT_CONFIG-$WRT_VER-"
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$CACHE_PREFIX" --limit 100 --json id --jq '.[].id' 2>/dev/null \
              | while read -r CACHE_ID; do
                  [ -n "$CACHE_ID" ] && gh cache delete --repo "$GITHUB_REPOSITORY" "$CACHE_ID" || true
                done
            echo "old caches cleanup done"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Install Feeds
        run: |
          cd ./wrt/
          #Packages.sh 里替换/删除过 feed 包，这里重新索引再安装，避免悬空的软链接
          ./scripts/feeds update -i -a
          ./scripts/feeds install -a

      - name: Custom Settings
        run: |
          cd ./wrt/

          cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          for i in 1 2 3; do
            if make -j$(nproc) download; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "下载失败次数过多，改用单线程重试"
              make -j1 V=s download
              break
            fi
            find dl -type f -size -1024c -delete 2>/dev/null || true
            sleep $((i * 5))
          done

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        shell: bash
        run: |
          cd ./wrt/
          #tee 会把 make 的退出码吞掉（没有 pipefail 时整个管道算成功），必须显式打开
          set -o pipefail
          make -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: Collect Build Log
        if: failure() && env.WRT_TEST != 'true'
        run: |
          tail -c 500000 /tmp/build.log > /tmp/build-tail.log 2>/dev/null || echo "no build log" > /tmp/build-tail.log
          {
            echo "======== 失败关键字 ========"
            grep -nE "ERROR: |Error [12]$|\*\*\* .*Error|No space left|is too big|failed to build" /tmp/build.log | tail -60 || true
          } >> /tmp/build-tail.log
          echo "tail 大小：$(du -h /tmp/build-tail.log | cut -f1)"

          #错误摘要直接写进 Job Summary：公开仓库的运行页面不用登录就能看到失败原因，
          #不用再去下载（需要登录的）log artifact
          {
            echo "### 编译失败：$WRT_CONFIG / $WRT_VER / ${WRT_HASH:-unknown}"
            echo '```text'
            grep -E "ERROR: |Error [12]$|\*\*\* .*Error|No space left|is too big|failed to build|checksum mismatch|SECURITY ERROR|undefined reference" /tmp/build.log | tail -25 || true
            echo '--- 日志最后 25 行 ---'
            tail -n 25 /tmp/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          #同一份摘要再用 ::error:: 发一次 annotation：这个接口匿名可读，
          #排错时不用任何人登录 GitHub 下载 artifact
          ERRS=$(grep -E "ERROR: |is too big|No space left|failed to build|checksum mismatch|SECURITY ERROR|undefined reference|Error [12]$" /tmp/build.log | tail -5 || true)
          [ -n "$ERRS" ] && echo "::error title=编译失败::$(echo "$ERRS" | head -c 2000 | tr '\n' '|')"

      - name: Upload Build Log
        if: failure() && env.WRT_TEST != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          path: /tmp/build-tail.log
          if-no-files-found: warn
          retention-days: 3

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/
          mkdir -p ./upload/

          cp -f ./.config ./upload/Config_"$WRT_CONFIG"_"$WRT_VER"_"$WRT_DATE".txt

          if [ "$WRT_TEST" = "true" ]; then
            exit 0
          fi

          KVER=$(cat ./bin/targets/*/*/profiles.json 2>/dev/null | jq -r '.linux_kernel.version // empty' 2>/dev/null | head -n 1)

          #只搬固件镜像，名字带上源码版本+编译时间，方便区分
          find ./bin/targets/ -type f \( -name "*.bin" -o -name "*.itb" -o -name "*.ubi" -o -name "*.img" -o -name "*.tar" -o -name "*.squashfs" \) | while read -r FILE; do
            cp -f "$FILE" "./upload/${WRT_VER}_${WRT_DATE}_$(basename "$FILE")"
          done

          echo "WRT_KVER=${KVER:-none}" >> "$GITHUB_ENV"

          echo "=========== 磁盘 ==========="
          df -h / /mnt 2>/dev/null || df -h
          echo "=========== bin/targets ==========="
          ls -1 ./bin/targets/*/*/ 2>/dev/null | head -40 || echo "(bin/targets 不存在)"
          echo "=========== upload ==========="
          ls -lh ./upload/

          #没生成固件就当场失败：否则会发一个只有配置文件、没有固件的 release
          if ! ls ./upload/*.bin ./upload/*.itb ./upload/*.img >/dev/null 2>&1; then
            echo "::error::一个固件镜像都没生成，编译其实没走完（看下面日志尾巴）"
            tail -n 80 /tmp/build.log 2>/dev/null || true
            exit 1
          fi

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          path: ./wrt/upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 5

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.WRT_CONFIG}}_${{env.WRT_VER}}_${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！

            ### ⚠️ 京东云 AX6600（RE-CS-02 / 雅典娜）刷机前提
            1. 本固件内核按 **6M（6144k）** 生成（`KERNEL_SIZE := 6144k`），对应社区 **6M 分区表**；如果机器之前刷过 12M 布局的固件，先到 u-boot 的 `/img.html` 刷 6M 分区表（rootfs 1024M 或 2048M）再刷固件
            2. u-boot 需 **2024.05.10** 及以上（进 `/uboot.html` 看版本号，已经是这版就不用动）
            3. 刷机前务必备份 `0:APPSBL`、`0:APPSBL_1`、`0:ART`、`0:CDT` 和 GPT，出问题才救得回来
            4. 先进 u-boot Web 刷 `factory.bin`，重启进 LuCI 后用 sysupgrade 刷 `squashfs-sysupgrade.bin`，**不要勾选保留配置**
            5. 三 radio 首次起 5.2G/HE160 要等 DFS-CAC（约 60 秒）才会出现

            内核版本：${{env.WRT_KVER}}
            NSS：QCA NSS 12.5 硬件加速（ECM / crypto / WiFi 卸载）

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：见仓库 Secret（不在此公开）

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}
            地址：${{env.WRT_IP}}
            密码：${{env.WRT_PW}}
